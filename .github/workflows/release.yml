name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate skills
        run: node scripts/validate.mjs
      - name: Test CLI
        run: npm test -w packages/cli
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
            exit 1
          fi
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; no token is used.
      # The trusted publisher on npmjs.com is tied to this workflow file name.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish -w packages/cli --provenance --access public
